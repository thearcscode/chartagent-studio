[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chartagent-studio"
version = "0.1.0"
description = "Chartagent Studio — the hosted product built on the chartagent library."
requires-python = ">=3.12,<3.13"
dependencies = [
    "chartagent>=0.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2",
    "PyJWT[crypto]>=2.8",
]

# The dependency declaration above never changes. The source below is dev-only:
# CI and deploy override it with a git dependency on a pinned SHA, and it is
# deleted entirely once chartagent is on PyPI.
[tool.uv.sources]
chartagent = { path = "../../chartagent", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
